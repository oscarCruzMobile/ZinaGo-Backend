spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

spring.datasource.url=jdbc:postgresql://localhost:5432/zinagobd
spring.datasource.username=zinago
spring.datasource.password=zinago123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=ZinagoPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Impedir que Tomcat envíe la versión en los encabezados de error
server.error.include-stacktrace=never
server.error.include-message=never